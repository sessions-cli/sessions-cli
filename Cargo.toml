[package]
name = "sessions"
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
description = "Multi-agent session manager for your terminal — tmux workspaces and a Ratatui sidebar"
authors = ["sessions-cli"]
license = "Apache-2.0"
repository = "https://github.com/sessions-cli/sessions-cli"
homepage = "https://github.com/sessions-cli/sessions-cli"
readme = "README.md"
keywords = ["tmux", "cli", "ai", "agents", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "sessions"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", default-features = true, features = ["event-stream"] }
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
toml_edit = "0.22"
ratatui-image = { version = "8", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25.10", features = ["png"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2"
blake3 = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
dead_code = "allow"

[lints.clippy]
too_many_arguments = "allow"