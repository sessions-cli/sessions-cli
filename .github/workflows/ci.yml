name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep jobs in lockstep with scripts/ci-local.sh (local is the source of truth).
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./scripts/ci-local.sh fmt

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-local.sh clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tmux/zsh required by daemon::tmux binding + shell quoting tests
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - run: ./scripts/ci-local.sh test
